<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扫描二维码获得帮助</title>
    <style>
      /* 全局基础样式 — 干净、柔和、居中 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          sans-serif;
        background: linear-gradient(145deg, #f7f9fc 0%, #eef2f6 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        margin: 0;
      }

      /* 卡片容器 — 柔和阴影 + 圆角 */
      .card {
        background: #ffffff;
        max-width: 560px;
        width: 100%;
        border-radius: 2.5rem;
        padding: 3rem 2rem 2.5rem;
        box-shadow:
          0 20px 35px -8px rgba(0, 20, 30, 0.15),
          0 8px 18px -6px rgba(0, 0, 0, 0.05);
        text-align: center;
        transition: transform 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(2px);
      }

      /* 主标题样式 — 清晰、温和、有分量 */
      .main-message {
        font-size: 2.2rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #0b2c3e;
        line-height: 1.3;
        margin-bottom: 2.8rem;
        position: relative;
        display: inline-block;
      }

      /* 标题下方的小装饰（可选，不影响布局） */
      .main-message::after {
        content: "";
        display: block;
        width: 70px;
        height: 3px;
        background: #b0c9d9;
        border-radius: 4px;
        margin: 1rem auto 0;
        opacity: 0.7;
      }

      /* 图片占位区域 — 明确指示可插入图片 */
      .qrcode-placeholder {
        width: 100%;
        min-height: 220px;
        background: #f5faff;
        border-radius: 2rem;
        border: 3px dashed #b6d0e2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #587b8f;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.3px;
        transition:
          background 0.2s,
          border-color 0.2s;
        margin-bottom: 0.5rem;
        padding: 1.8rem 1.2rem;
        text-align: center;
        line-height: 1.6;
      }

      /* 占位符内部的图标 (纯CSS绘制简易二维码轮廓) */
      .placeholder-icon {
        display: inline-block;
        width: 56px;
        height: 56px;
        border: 2px solid #9bb7c9;
        border-radius: 12px;
        margin-bottom: 1rem;
        position: relative;
        background: #ffffffd9;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
      }

      .placeholder-icon::before,
      .placeholder-icon::after {
        content: "";
        position: absolute;
        background: #9bb7c9;
        border-radius: 3px;
      }

      .placeholder-icon::before {
        width: 16px;
        height: 16px;
        top: 12px;
        left: 12px;
        box-shadow:
          24px 0 0 #9bb7c9,
          0 24px 0 #9bb7c9;
        border-radius: 4px;
      }

      /* 右上角小方块（模仿二维码定位点） */
      .placeholder-icon::after {
        width: 16px;
        height: 16px;
        bottom: 12px;
        right: 12px;
        background: #9bb7c9;
        border-radius: 4px;
        box-shadow:
          -24px 0 0 #9bb7c9,
          0 -24px 0 #9bb7c9;
        opacity: 0.5;
      }

      /* 提示文字 "此处插入图片" 更明显一些 */
      .placeholder-text {
        background: #e3eef7;
        padding: 0.4rem 1.2rem;
        border-radius: 40px;
        font-size: 0.9rem;
        color: #2c5770;
        font-weight: 500;
        box-shadow:
          inset 0 1px 3px rgba(255, 255, 255, 0.8),
          0 2px 4px rgba(0, 0, 0, 0.02);
        margin-top: 0.8rem;
        letter-spacing: 0.3px;
      }

      /* 说明文字 (可选，用来提示用户这里可以放图片) */
      .hint {
        font-size: 0.9rem;
        color: #7a98aa;
        margin-top: 1.6rem;
        font-style: italic;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .hint span {
        background: #eaf1f8;
        padding: 0.2rem 0.8rem;
        border-radius: 30px;
      }

      /* 响应式调整 */
      @media (max-width: 480px) {
        .card {
          padding: 2rem 1.2rem 2rem;
          border-radius: 2rem;
        }

        .main-message {
          font-size: 1.8rem;
          margin-bottom: 2rem;
        }

        .qrcode-placeholder {
          min-height: 180px;
          padding: 1.2rem 0.8rem;
        }
      }

      /* 保留图片插入位置灵活：如果你把 <img> 放进占位符，它会自动居中并适应宽度 */
      .qrcode-placeholder img {
        max-width: 100%;
        max-height: 240px;
        border-radius: 1rem;
        object-fit: contain;
        display: block;
        margin: 0 auto;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- 核心文本：扫描二维码获得帮助 -->
      <div class="main-message">扫描二维码获得帮助</div>

      <!-- 图片插入位置：虚线框区域，完全留给图片 -->
      <div class="qrcode-placeholder">
        <!-- 装饰性二维码占位图标 (纯视觉效果) -->
        <div class="placeholder-icon" aria-hidden="true"></div>

        <!-- 明确指示可替换为图片，但保留占位说明，方便识别 -->
        <div class="placeholder-text">📷 此处插入二维码图片</div>

        <!-- 
        下方注释说明：
        您可以将 <img> 标签放在此处，替换掉上面的占位图标和文字。
        例如：
        <img src="your-qrcode.png" alt="帮助二维码">
        样式已就绪，图片会自动适应区域。
      --></div>

      <!-- 可选小提示，不影响主功能 -->
      <div class="hint">
        <span>将二维码图片放入上方区域</span>
      </div>
    </div>
  </body>
</html>
